name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Install SDK/NDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
      - name: Fetch native tunnel engine (hev-socks5-tunnel)
        run: git clone --depth 1 --recursive --shallow-submodules https://github.com/heiher/hev-socks5-tunnel app/src/main/jni/hev-socks5-tunnel
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: IPRotator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
